name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm

            # package.json pins npm (devEngines): install that version outside the repo, where the pin is not checked.
            - name: Install pinned npm
              working-directory: ${{ runner.temp }}
              run: npm install -g npm@11.20.0

            - run: npm ci
            - run: npm run check
            - run: npm test
            - run: npm run licenses:check
            - run: npm run build

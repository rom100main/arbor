appId: dev.arbor.app
productName: Arbor
directories:
    output: release
files:
    - dist/**
    - build/icon.png
    - package.json
extraResources:
    - LICENSE
    - THIRD-PARTY-NOTICES.md
mac:
    category: public.app-category.productivity
    # Ad-hoc signature: no Apple account needed, but downloads open via "Open Anyway" instead of "damaged".
    # Replace with a Developer ID (and notarize) to get in-place updates on macOS.
    identity: "-"
    # Only needed for notarization, with an ad-hoc signature it blocks loading Electron's frameworks.
    hardenedRuntime: false
    target:
        - target: dmg
          arch: arm64
        # The updater installs from the zip.
        - target: zip
          arch: arm64
# Green DMG background matching the app icon (#1f4d2b):
# the Arbor.app square blends into it so only the white tree shows.
# Regenerate the background with `sh scripts/build-dmg-background.sh`.
# Note: do not also set backgroundColor
# (dmg-builder rejects background + backgroundColor together).
dmg:
    background: build/dmg/background.png
    # Icon centers, must match the arrow/sparkles in the background image.
    # Left = the tree (Arbor.app), right = Applications alias.
    contents:
        - x: 165
          y: 185
          type: file
        - x: 495
          y: 185
          type: link
          path: /Applications
win:
    target:
        - target: nsis
          arch: [x64, arm64]
nsis:
    oneClick: true
    perMachine: false
linux:
    category: Network
    target: AppImage
publish:
    provider: github
    releaseType: draft
